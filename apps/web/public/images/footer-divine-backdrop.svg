<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="saffronGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="divineRays" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
    <pattern id="mandalaPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="48" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="60" cy="60" r="32" fill="none" stroke="#d97706" stroke-opacity="0.06" stroke-width="1"/>
      <polygon points="60,18 72,48 102,48 78,66 88,96 60,78 32,96 42,66 18,48 48,48" fill="none" stroke="#fbbf24" stroke-opacity="0.07" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1440" height="600" fill="#0f0c08"/>
  <rect width="1440" height="600" fill="url(#saffronGlow)"/>
  <rect width="1440" height="600" fill="url(#goldGlow)"/>
  <rect width="1440" height="600" fill="url(#mandalaPattern)"/>

  <!-- Divine Rays -->
  <g opacity="0.6">
    <polygon points="1440,0 1000,600 1440,600" fill="url(#divineRays)"/>
    <polygon points="1200,0 600,600 900,600" fill="url(#divineRays)" opacity="0.5"/>
    <polygon points="800,0 200,600 450,600" fill="url(#divineRays)" opacity="0.3"/>
  </g>

  <!-- Sacred Om Vibration Motifs -->
  <g transform="translate(1150, 180)" opacity="0.12" fill="#fbbf24">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ea580c" stroke-width="1"/>
    <!-- Sacred Om Symbol in center of right mandala -->
    <text x="0" y="32" font-family="serif" font-size="96" text-anchor="middle" fill="#fbbf24" font-weight="bold">ॐ</text>
  </g>

  <g transform="translate(200, 420)" opacity="0.09" fill="#f59e0b">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="24" font-family="serif" font-size="72" text-anchor="middle" fill="#fbbf24">ॐ</text>
  </g>

  <!-- Golden Lotus Petals Silhouette at base -->
  <g fill="#f59e0b" fill-opacity="0.08" transform="translate(720, 520)">
    <path d="M0,-80 C30,-40 60,-10 90,0 C60,10 30,40 0,80 C-30,40 -60,10 -90,0 C-60,-10 -30,-40 0,-80 Z"/>
    <path d="M-60,-60 C-20,-30 10,-5 40,0 C10,5 -20,30 -60,60 C-40,20 -15,5 -60,-60 Z" transform="rotate(30)"/>
    <path d="M60,-60 C20,-30 -10,-5 -40,0 C-10,5 20,30 60,60 C40,20 15,5 60,-60 Z" transform="rotate(-30)"/>
  </g>
</svg>
